name: Step 0, Welcome

# ==============================================================================
# Workflow: Step 0, Welcome
# Description:
#   This workflow acts as the initialization step for the "Introduction to GitHub"
#   course. It is triggered when the learner creates a new repository from the
#   template. Its primary purpose is to transition the course from Step 0 to
#   Step 1 by updating the README.md file.
#
# Triggers:
#   - Push to the `main` branch (occurs upon repository creation).
#   - Workflow Dispatch (manual trigger).
#
# Reference:
#   - https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
# ==============================================================================

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  # Need `contents: read` to checkout the repository.
  # Need `contents: write` to update the step metadata.
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # Job: Check current step number
  # Description:
  #   Reads the current step number from the `.github/steps/-step.txt` file to
  #   ensure the main logic runs only when the learner is on the correct step.
  # Outputs:
  #   current_step: The integer value of the current step.
  # ----------------------------------------------------------------------------
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  # ----------------------------------------------------------------------------
  # Job: On welcome
  # Description:
  #   Executes the transition from Step 0 to Step 1. It verifies the current
  #   step is 0, checks out the repository, and runs the `skills/action-update-step`
  #   action to update the course content.
  # Depends On:
  #   get_current_step
  # ----------------------------------------------------------------------------
  on_welcome:
    name: On welcome
    needs: get_current_step

    # We will only run this action when:
    # 1. This repository isn't the template repository.
    # 2. The step is currently 0.
    # Reference: https://docs.github.com/en/actions/learn-github-actions/contexts
    # Reference: https://docs.github.com/en/actions/learn-github-actions/expressions
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 0 }}

    # We'll run Ubuntu for performance instead of Mac or Windows.
    runs-on: ubuntu-latest

    steps:
      # We'll need to check out the repository so that we can edit README.md.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Let's get all the branches.

      # In README.md, switch step 0 for step 1.
      - name: Update to step 1
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 0
          to_step: 1
          branch_name: my-first-branch
